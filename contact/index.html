<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Contact — XAVRON | Awais</title>
  <meta name="description" content="Contact Awais (XAVRON) for freelance web development, full-stack web apps, or custom web tools. Replies within 24 hours." />
  <!-- TODO: Replace https://xavron.dev with your final deployed domain -->
  <link rel="canonical" href="https://xavron.dev/contact" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="XAVRON" />
  <meta property="og:title" content="Contact — XAVRON | Awais" />
  <meta property="og:description" content="Let's build something remarkable. Got an idea? Let's talk." />
  <meta property="og:url" content="https://xavron.dev/contact" />
  <meta property="og:image" content="https://xavron.dev/assets/img/queryhub.webp" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Contact — XAVRON | Awais" />
  <meta name="twitter:description" content="Let's build something remarkable. Got an idea? Let's talk." />
  <meta name="twitter:image" content="https://xavron.dev/assets/img/queryhub.webp" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <div id="mobile-menu-root"></div>

  <main id="main-content">
    <section class="section" style="padding-top: clamp(2.5rem, 5vw, 4.25rem);">
      <div class="container">
        <div class="section-head" data-hero-stagger>
          <span class="status-pill" style="align-self: flex-start;">
            <span class="status-dot" aria-hidden="true"></span>
            <span data-contact-status>Available for freelance, replies within 24 hours</span>
          </span>
          <h1 class="page-h1">
            <span class="hero-line-mask"><span class="hero-line">Let's build something remarkable.</span></span>
          </h1>
          <p class="lead-copy">Got an idea? Let's talk.</p>
        </div>

        <div class="contact-layout">
          <!-- Contact Form -->
          <div class="surface-card card-featured" data-reveal>
            <span class="mono-label mono-label--accent" style="margin-bottom: 1.1rem;">Send a Message</span>

            <form id="contact-form" class="form-grid" novalidate>
              <!-- Honeypot field for spam protection -->
              <div class="hp-field" aria-hidden="true">
                <label for="contact-gotcha">Leave this field blank</label>
                <input type="text" id="contact-gotcha" name="_gotcha" tabindex="-1" autocomplete="off" />
              </div>

              <div class="field-group">
                <label for="contact-name" class="field-label">Name</label>
                <input
                  type="text"
                  id="contact-name"
                  name="name"
                  class="field-input"
                  placeholder="Your name"
                  required
                  autocomplete="name"
                />
                <span id="error-name" class="field-error" role="alert"></span>
              </div>

              <div class="field-group">
                <label for="contact-email" class="field-label">Email</label>
                <input
                  type="email"
                  id="contact-email"
                  name="email"
                  class="field-input"
                  placeholder="you@example.com"
                  required
                  autocomplete="email"
                />
                <span id="error-email" class="field-error" role="alert"></span>
              </div>

              <div class="field-group">
                <label for="contact-type" class="field-label">Project Type <span style="color: var(--muted);">(optional)</span></label>
                <select id="contact-type" name="projectType" class="field-select">
                  <option value="">Select a project type...</option>
                  <option value="Landing Page / Business Website">Landing Page / Business Website</option>
                  <option value="Full-Stack Web App">Full-Stack Web App</option>
                  <option value="Custom Web Tool">Custom Web Tool</option>
                  <option value="Website Redesign">Website Redesign</option>
                  <option value="Other / General Inquiry">Other / General Inquiry</option>
                </select>
              </div>

              <div class="field-group">
                <label for="contact-message" class="field-label">Message</label>
                <textarea
                  id="contact-message"
                  name="message"
                  class="field-textarea"
                  placeholder="Tell me a little about your project, goals, or timeline..."
                  required
                ></textarea>
                <span id="error-message" class="field-error" role="alert"></span>
              </div>

              <div>
                <button type="submit" id="contact-submit" class="btn btn--primary" style="width: 100%;">
                  Send Message
                </button>
              </div>

              <div id="form-status" class="form-feedback" hidden aria-live="polite"></div>
            </form>
          </div>

          <!-- Other Ways to Reach Me -->
          <aside class="surface-card" data-reveal>
            <span class="mono-label mono-label--accent" style="margin-bottom: 1rem;">Other Ways to Reach Me</span>
            <p class="project-desc" style="margin-bottom: 1.25rem;">
              Prefer direct contact? Copy my email or reach out on the platforms below.
            </p>
            <div class="reach-list" data-contact-reach>
              <div class="reach-item">
                <div class="reach-item-text">
                  <span class="mono-label">GitHub</span>
                  <span class="reach-item-val">github.com/XAVRON-DEV</span>
                </div>
                <a href="https://github.com/XAVRON-DEV" class="btn btn--secondary btn--sm" target="_blank" rel="noopener noreferrer">Open ↗</a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
